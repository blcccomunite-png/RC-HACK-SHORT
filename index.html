<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --panel-width: 228px;
            --accent: #8b2cff;
            --accent2: #00d9ff;
            --panel-dark: #05020b;
            --panel-deep: #12051f;
            --panel-text: #fff;
            --muted: #b8a9c8;
        }
        * {
            box-sizing: border-box
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: "Segoe UI", Arial, sans-serif
        }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0
        }
        #c-panel {
            position: fixed;
            top: 112px;
            left: calc(50% - 114px);
            width: var(--panel-width);
            padding: 10px;
            color: var(--panel-text);
            text-align: center;
            cursor: move;
            touch-action: none;
            isolation: isolate;
            overflow: hidden;
            z-index: 10000;
            border: 1px solid #9d54ff;
            border-radius: 22px;
            background: radial-gradient(circle at 50% -12%, rgba(174, 50, 255, .28), transparent 35%),
                linear-gradient(180deg, rgba(35, 8, 65, .99), rgba(12, 3, 25, .995) 50%, rgba(2, 2, 7, .999));
            box-shadow: 0 0 0 3px #17052b, 0 0 0 5px rgba(139, 44, 255, .2), 0 0 25px rgba(139, 44, 255, .55),
                0 18px 46px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 30px rgba(120, 0, 255, .15);
            backdrop-filter: blur(13px) saturate(130%);
            -webkit-backdrop-filter: blur(13px) saturate(130%);
        }
        #c-panel:before {
            content: "";
            position: absolute;
            inset: 5px;
            z-index: -1;
            pointer-events: none;
            border: 1px solid rgba(157, 84, 255, .4);
            border-radius: 17px;
            box-shadow: inset 0 0 18px rgba(139, 44, 255, .12)
        }
        #c-panel:after {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: -12px;
            height: 24px;
            z-index: -2;
            border-radius: 50%;
            background: rgba(139, 44, 255, .4);
            filter: blur(12px)
        }
        .panel-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 35px;
            padding: 0 1px 7px 5px;
            border-bottom: 1px solid rgba(157, 84, 255, .3)
        }
        .panel-name {
            min-width: 0;
            overflow: hidden;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.85px;
            white-space: nowrap;
            text-overflow: ellipsis;
            text-transform: uppercase;
            text-shadow: 0 0 9px rgba(190, 100, 255, .8)
        }
        .panel-close {
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid #dca7ff;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(145deg, #b94cff, #7a14e8 55%, #39007d);
            box-shadow: 0 0 0 3px rgba(174, 80, 255, .15), 0 0 15px rgba(157, 45, 255, .75), inset 0 1px 0 rgba(255, 255, 255, .34);
            font-size: 23px;
            line-height: 27px;
            cursor: pointer
        }
        .panel-close:active {
            transform: scale(.95)
        }
        #c-panel.minimized {
            width: 46px !important;
            height: 46px !important;
            padding: 0 !important;
            display: grid !important;
            place-items: center;
            border-radius: 50% !important;
            background: linear-gradient(145deg, #c65aff, #7411dc 55%, #31006b);
            box-shadow: 0 0 0 3px rgba(157, 70, 255, .15), 0 0 18px rgba(139, 39, 255, .7), 0 10px 24px rgba(0, 0, 0, .65)
        }
        #c-panel.minimized * {
            display: none !important
        }
        #c-panel.minimized:before {
            display: none
        }
        /* 🔥 FIXED: "Z" → "RC" */
        #c-panel.minimized:after {
            content: "RC";
            position: static;
            width: auto;
            height: auto;
            background: none;
            filter: none;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            text-shadow: 0 0 12px #fff;
            letter-spacing: 1px;
        }
        .screen {
            display: none
        }
        .active-screen {
            display: block
        }
        .screen-shell {
            padding: 8px 3px 2px
        }
        .brand-title {
            display: inline-flex;
            align-items: center;

            min-height: 22px;

        }
        .welcome-msg {

            border: 1px solid rgba(157, 84, 255, .3);

            font-size: 6.5px;
            font-weight: 700;

        .prediction-card {
            position: relative;

            padding: 7px;

            border: 1px solid rgba(157, 84, 255, .48);
            border-radius: 13px;

        }
        .prediction-card:before {
            content: "";

            inset: 5px;
            border: 1px solid rgba(255, 255, 255, .025);
            border-radius: 9px
        }
        .result-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 58px 1fr;
            gap: 8px;
            align-items: center;
            min-height: 69px;
            text-align: left
        }
        .result-orb {
            position: relative;
            width: 54px;
            height: 54px;
            display: grid;

            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            font-weight: 1000;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .42)
        }
        .orb-green {

        }

        }

        }
        .result-orb:before,
        .result-orb:after {
            content: "";
            position: absolute;
            inset: -4px;
            border: 2px solid rgba(0, 217, 255, .8);
            border-left-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            transform: rotate(14deg)
        }
        .result-orb:after {
            inset: 5px;
            border-width: 1px;
            border-color: rgba(255, 255, 255, .72);
            border-right-color: transparent;
            transform: rotate(-25deg)
        }
        .result-copy {
            min-width: 0
        }
        .result-kicker {
            display: block;
            margin-bottom: 2px;
            color: #9d91ab;
            font-size: 5.5px;
            font-weight: 700;
            letter-spacing: 2.45px;
            text-transform: uppercase
        }
        .res-main {
            display: block;
            color: #d86cff;
            font-size: 24px;
            line-height: 1;
            font-weight: 1000;
            letter-spacing: .5px;
            text-shadow: 0 0 11px rgba(190, 65, 255, .65), 0 2px 0 rgba(0, 0, 0, .42)
        }
        .confidence-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 6px
        }
        .conf-label {
            flex: 0 0 auto;
            color: #a99bb5;
            font-size: 5.5px;
            font-weight: 800;
            letter-spacing: .75px;
            white-space: nowrap;

        }
        .confidence-track {

            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, .09);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, .72)
        }
        .confidence-track:after {
            content: "";
            display: block;
            width: var(--conf-width, 91%);
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #8b2cff, #00d9ff);
            box-shadow: 0 0 7px rgba(0, 217, 255, .8)
        }
        .res-sub {
            position: relative;
            z-index: 1;
            display: block;
            min-height: 18px;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid rgba(157, 84, 255, .2);
            color: #c2b3cf;
            font-size: 5.4px;
            line-height: 1.35;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-align: center;
            text-transform: uppercase;
            overflow-wrap: anywhere
        }
        .res-sub:before,
        .res-sub:after {
            content: "●";
            margin: 0 5px;
            font-size: 5px;
            text-shadow: 0 0 6px currentColor
        }
        .pattern-reason {
            display: block;
            margin-top: 4px;
            color: #cbbce0;
            font-size: 5.8px;
            font-weight: 700;
            letter-spacing: .4px;

        .server-footer {

            font-weight: 800;

        .timer-display {

            color: #d8ccdf;
            font-size: 5.6px;
            font-weight: 900;

            white-space: nowrap

        #history-overlay {
            position: fixed;
            top: 118px;
            left: 12px;
            width: min(78vw, 300px);
            max-height: 62vh;
            padding: 11px;
            overflow-y: auto;
            display: none;
            z-index: 10010;

            box-shadow: 0 0 0 3px rgba(35, 0, 70, .82), 0 0 20px rgba(139, 44, 255, .4), 0 18px 38px rgba(0, 0, 0, .7);
            cursor: move;
            touch-action: none
        }
        .hist-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 5px;
            color: #eadff1;
            font-size: 8px
        }
        .hist-table th {
            padding: 7px 4px;
            color: #fff;
            background: rgba(139, 44, 255, .2);

        }
        .hist-table td {

            border-top: 1px solid rgba(255, 255, 255, .04);

        }
        @media(max-width:600px) {

                --panel-width: 202px
            }

            }

            }

            }

            }
        }
        @media(max-width:340px) {
            :root {
                --panel-width: 188px
            }
            #c-panel {
                left: calc(50% - 94px);

            }

                grid-template-columns: 48px 1fr
            }
            .result-orb {
                width: 44px;

            }

        }
        @media(max-height:620px) {
            #c-panel {
                top: 58px;

                overflow-y: auto;
                scrollbar-width: none
            }
            #c-panel::-webkit-scrollbar {
                width: 0;
                height: 0
            }
        }
    </style>

    <script>
        const KEY = "VIP",
            HISTORY_SIZE = 30;
        let activeServer = "1M",
            apiURL = "",
            isRunning = false,
            currentPrediction = null,
            lastProcessedID = "",
            historyCache = [],
            lastFetchTime = 0;
        const panel = document.getElementById("c-panel");

        function speak(text, times = 1) { if ("speechSynthesis" in window)
                for (let i = 0; i < times; i++) { let u = new SpeechSynthesisUtterance(text);
                    u.lang = "bn-BD";
                    u.rate = .9;
                    u.volume = 1;
                    speechSynthesis.speak(u) } }

        function showScreen(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active-screen"));
            document.getElementById(id).classList.add("active-screen") }

        function toggleMinimize(e) { if (e) e.stopPropagation();
            panel.classList.toggle("minimized") }
        panel.addEventListener("click", e => { if (panel.classList.contains("minimized")) toggleMinimize(e) });

        function toggleHistory() { let h = document.getElementById("history-overlay");
            h.style.display = h.style.display === "block" ? "none" : "block" }

        function verifyPass() { if (document.getElementById("pass").value === KEY) showScreen("server-screen");
            else alert("ACCESS DENIED: WRONG KEY!") }

        function selectServer(type) {
            activeServer = type;
            apiURL = (type === "1M" ? "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" :
                "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json") + "?pageNo=1&pageSize=" + HISTORY_SIZE;
            showScreen("engine-ui");
            isRunning = true;
            historyCache = [];
            lastProcessedID = "";
            document.getElementById("hist-body").innerHTML = "";
            fetchHistoryAndAnalyze();
            startEngine()
        }

        function getOrbInfo(num) {
            return Number(num) % 2 !== 0 ? { orbClass: "orb-green", colorLabel: "GREEN" } : { orbClass: "orb-red",
                colorLabel: "RED" };
        }

        function updateOrbDisplay(num) {
            const orb = document.getElementById("result-orb"),
                info = getOrbInfo(num);
            orb.classList.remove("orb-default", "orb-green", "orb-red");
            orb.classList.add(info.orbClass);
            orb.textContent = num;
        }

        async function fetchHistory() {
            try {
                const res = await fetch(apiURL),
                    json = await res.json();
                if (json && json.data && Array.isArray(json.data.list)) {
                    let list = json.data.list.map(x => ({ issueNumber: String(x.issueNumber), number: parseInt(x.number,
                            10) }));
                    list.sort((a, b) => b.issueNumber.localeCompare(a.issueNumber));
                    historyCache = list;
                    return list;
                }
            } catch (e) { console.warn("Fetch history error:", e) }
            return [];
        }

        function toBS(n) { return n >= 5 ? "BIG" : "SMALL" }

        function findRepeatingPattern(seq) {
            if (seq.length < 4) return null;
            for (let len = 2; len <= Math.min(5, Math.floor(seq.length / 2)); len++) {
                let p = seq.slice(-len),
                    m = 0,
                    t = 0;
                for (let i = seq.length - len - 1; i >= 0; i -= len) { let w = seq.slice(i, i + len); if (w.length === len) { t++;
                        if (w.every((v, j) => v === p[j])) m++ } }
                if (t >= 2 && m / t >= .7) return { pattern: p, confidence: Math.round(m / t * 100) }
            }
            return null
        }

        function detectStreak(seq) {
            if (!seq.length) return { type: null, length: 0 };
            let last = seq[seq.length - 1],
                len = 1;
            for (let i = seq.length - 2; i >= 0; i--) { if (seq[i] === last) len++;
                else break }
            return { type: last, length: len }
        }

        function chooseNum(nums, bs) {
            let c = nums.filter(n => toBS(n) === bs);
            if (!c.length) return bs === "BIG" ? 7 : 2;
            let f = {};
            c.forEach(n => f[n] = (f[n] || 0) + 1);
            return +Object.entries(f).sort((a, b) => b[1] - a[1])[0][0]
        }

        function predictWithPattern(history) {
            if (!history || history.length < 2) { let n = Math.floor(Math.random() * 10); return { bs: toBS(n), num: n,
                    confidence: 45 + Math.floor(Math.random() * 20), reason: "Insufficient data — using fallback" } }
            let bsSeq = history.map(h => toBS(h.number)),
                nums = history.map(h => h.number),
                rep = findRepeatingPattern(bsSeq);
            if (rep) { let bs = rep.pattern[0]; return { bs, num: chooseNum(nums, bs), confidence: Math.round(Math.min(
                        65 + rep.confidence * .25, 92)), reason: `🔁 Repeating pattern [${rep.pattern.join(" → ")}] (${rep.confidence}% match)` } }
            let st = detectStreak(bsSeq);
            if (st.length >= 4) { let bs = st.type === "BIG" ? "SMALL" : "BIG"; return { bs, num: chooseNum(nums, bs),
                    confidence: Math.round(Math.min(58 + st.length * 3, 90)),
                    reason: `📊 Streak of ${st.length} ${st.type}s → predicting opposite` } }
            let recent = bsSeq.slice(-15),
                big = recent.filter(x => x === "BIG").length,
                small = recent.length - big,
                diff = Math.abs(big - small);
            if (recent.length >= 8 && diff >= 3) { let bs = big > small ? "SMALL" : "BIG"; return { bs, num: chooseNum(nums,
                        bs), confidence: Math.round(Math.min(55 + diff * 2.5, 88)),
                    reason: `⚖️ Recent bias: ${big}B / ${small}S → predicting ${bs}` } }
            let totalBig = bsSeq.filter(x => x === "BIG").length,
                totalSmall = bsSeq.length - totalBig,
                bs = totalBig >= totalSmall ? "BIG" : "SMALL";
            return { bs, num: chooseNum(nums, bs), confidence: Math.round(Math.min(50 + Math.min(Math.abs(totalBig -
                        totalSmall) * 1.2, 30), 82)), reason: `📈 Overall frequency: ${totalBig}B / ${totalSmall}S → ${bs}` }
        }

        async function analyzeAndPredict() {
            if (!apiURL) return;
            let history = await fetchHistory();
            if (!history.length) { let n = Math.floor(Math.random() * 10);
                currentPrediction = { id: "fallback_" + Date.now(), bs: toBS(n), num: n, confidence: 40 + Math.floor(Math
                        .random() * 20), reason: "⏳ No data from server, using fallback" };
                return updateUI() }
            let r = predictWithPattern(history),
                nextId = "unknown";
            try { nextId = (BigInt(history[0].issueNumber) + 1n).toString() } catch (e) {}
            currentPrediction = { id: nextId, bs: r.bs, num: r.num, confidence: r.confidence, reason: r.reason };
            updateUI()
        }

        function updateUI() {
            if (!currentPrediction) return;
            let p = currentPrediction,
                info = getOrbInfo(p.num);
            document.getElementById("conf-txt").innerText = `CONFIDENCE: ${p.confidence}%`;
            document.getElementById("res-bs").innerText = p.bs;
            document.getElementById("res-color-num").innerText = `${info.colorLabel} | NUMBER: ${p.num}`;
            document.getElementById("pattern-reason").innerText = p.reason || "🧠 Pattern analysis active";
            updateOrbDisplay(p.num);
            document.getElementById("conf-track").style.setProperty("--conf-width", p.confidence + "%");
        }

        async function checkWin() {
            try {
                let j = await (await fetch(apiURL)).json(),
                    list = j.data.list;
                if (!list || !list.length) return;
                let top = list[0],
                    num = parseInt(top.number, 10),
                    id = String(top.issueNumber);
                if (id !== lastProcessedID && currentPrediction && id === currentPrediction.id) {
                    let win = currentPrediction.bs === toBS(num),
                        row = document.createElement("tr");
                    row.innerHTML =
                        `<td>${id.slice(-4)}</td><td>${currentPrediction.bs}</td><td>${num}</td><td style="color:${win?"#00ff9d":"#ff3333"}">${win?"✅ JACKPOT":"❌ MISS"}</td>`;
                    document.getElementById("hist-body").prepend(row);
                    lastProcessedID = id;
                    if (win) speak("জ্যাকপট! আপনি জিতেছেন!", 2)
                }
            } catch (e) {}
        }

        function fetchHistoryAndAnalyze() { return analyzeAndPredict() }

        function startEngine() {
            setInterval(async () => {
                if (!isRunning) return;
                let sec = new Date().getSeconds(),
                    rem = activeServer === "1M" ? 60 - sec : 30 - (sec % 30);
                document.getElementById("time-txt").innerText = `TIME LEFT: ${String(rem).padStart(2,"0")}s`;
                await checkWin();
                let now = Date.now();
                if (now - lastFetchTime > 2000) { await analyzeAndPredict();
                    lastFetchTime = now }
            }, 1000)
        }

        function setupDrag(el) {
            let off = [0, 0],
                down = false;
            const start = e => { down = true; let x = e.type.includes("touch") ? e.touches[0].clientX : e.clientX,
                    y = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;
                off = [el.offsetLeft - x, el.offsetTop - y] };
            const move = e => { if (!down) return; let x = e.type.includes("touch") ? e.touches[0].clientX : e.clientX,
                    y = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;
                el.style.left = x + off[0] + "px";
                el.style.top = y + off[1] + "px" };
            el.addEventListener("mousedown", start);
            el.addEventListener("touchstart", start, { passive: false });
            document.addEventListener("mouseup", () => down = false);
            document.addEventListener("touchend", () => down = false);
            document.addEventListener("mousemove", move);
            document.addEventListener("touchmove", e => { if (down) { e.preventDefault();
                    move(e) } }, { passive: false })
        }
        setupDrag(panel);
        setupDrag(document.getElementById("history-overlay"));
        window.addEventListener("load", () => setTimeout(() => speak("আর সি অরা হ্যাক আপনাকে স্বাগতম。", 1), 500));
        console.log("RC AURA HACK — UI loaded.");
    </script>
